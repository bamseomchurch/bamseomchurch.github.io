<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>한강밤섬교회</title>
  <meta name="description" content="대한예수교장로회 한강밤섬교회 · 주일예배 오전 11시 · 서울특별시 마포구 창전로 32 밤섬빌딩 4층">
  <!-- 카카오톡·문자로 링크를 보낼 때 보이는 미리보기 -->
  <meta property="og:title" content="우리는 한강밤섬교회입니다">
  <meta property="og:description" content="주일예배 오전 11시 · 마포구 창전로 32 밤섬빌딩 4층">
  <meta property="og:image" content="https://www.bamseom.net/church.jpg">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    /* 예배당 나무색에서 뽑은 색 */
    :root {
      --birch: #d9b77a;     /* 밝은 자작나무 벽 */
      --cedar: #a8683a;     /* 강단 뒤 나무 블록 */
      --walnut: #5b3a22;    /* 짙은 나무색: 제목·버튼 */
      --tint: #f6eee2;      /* 옅은 나무색 바탕 */
      --ink: #2a211b;
      --soft: #6e6258;
      --paper: #ffffff;
      --line: #e6d8c4;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --walnut: #e2bf86;
        --tint: #221a14;
        --ink: #efe6da;
        --soft: #b3a596;
        --paper: #15100c;
        --line: #3a2e24;
      }
      .btn.primary { color: #2a1a0e; }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      font-size: 17px;
      line-height: 1.7;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .wrap { max-width: 680px; margin: 0 auto; padding: 0 22px; }

    /* 머리 부분: 예배당 사진 위에 CI와 교회 이름 */
    header {
      color: #fff;
      background:
        linear-gradient(90deg, rgba(40, 24, 12, .55) 0%, rgba(40, 24, 12, 0) 30%, rgba(40, 24, 12, 0) 70%, rgba(40, 24, 12, .55) 100%),
        linear-gradient(180deg, rgba(40, 24, 12, .25) 0%, rgba(40, 24, 12, .75) 100%),
        url("church.jpg") center 70% / cover no-repeat,
        var(--walnut);
      min-height: clamp(200px, 26vw, 320px);
      display: flex;
      align-items: flex-end;
      padding: calc(36px + env(safe-area-inset-top, 0px)) 0 30px;
    }
    header .wrap { width: 100%; }
    .id { display: flex; align-items: center; gap: 18px; }
    .id img {
      width: 84px; height: 84px; flex: none;
      border-radius: 50%;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, .85);
    }
    .denomination { margin: 0; font-size: 14px; color: rgba(255, 255, 255, .85); }
    h1 {
      margin: 0;
      font-family: "Gowun Batang", "Nanum Myeongjo", serif;
      font-weight: 700;
      font-size: clamp(32px, 8.5vw, 48px);
      line-height: 1.2;
      text-shadow: 0 1px 12px rgba(0, 0, 0, .35);
    }
    .worship {
      margin: 22px 0 0;
      padding-left: 12px;
      border-left: 4px solid var(--birch);
      font-size: 18px;
      line-height: 1.5;
    }
    .worship strong { font-weight: 700; color: #f6d9a6; }

    section { padding: 40px 0 8px; }
    h2 {
      margin: 0 0 16px;
      font-family: "Gowun Batang", "Nanum Myeongjo", serif;
      font-size: 26px;
      font-weight: 700;
      color: var(--walnut);
    }
    .frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: var(--tint);
      border-radius: 6px;
      overflow: hidden;
    }
    .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .frame.map { aspect-ratio: 4 / 3; }
    .notice { position: absolute; inset: 0; margin: 0; display: grid; place-items: center; padding: 20px; text-align: center; color: var(--soft); font-size: 15px; }

    .buttons { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 48px; padding: 0 20px;
      border-radius: 999px;
      font: inherit; font-size: 16px; font-weight: 500;
      text-decoration: none; cursor: pointer;
      border: 1px solid var(--line);
      background: var(--paper); color: var(--ink);
    }
    .btn.primary { background: var(--walnut); border-color: var(--walnut); color: #fff; }
    .btn:focus-visible { outline: 3px solid var(--cedar); outline-offset: 2px; }

    address { font-style: normal; margin-top: 18px; font-size: 18px; }
    address small { display: block; color: var(--soft); font-size: 15px; }

    footer {
      margin-top: 56px;
      padding: 30px 0 40px;
      background: var(--tint);
      color: var(--soft);
      font-size: 14px;
      line-height: 1.8;
    }
    footer p { margin: 0; }
    footer .name { color: var(--walnut); font-weight: 700; font-size: 15px; margin-bottom: 4px; }
    footer a { color: var(--walnut); }
    footer .copy { margin-top: 12px; font-size: 13px; }
  </style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="id">
      <img src="logo.png" alt="우리는 한강밤섬교회입니다">
      <div>
        <p class="denomination">대한예수교장로회</p>
        <h1>한강밤섬교회</h1>
      </div>
    </div>
    <p class="worship">주일예배 <strong>오전 11시</strong></p>
  </div>
</header>

<main class="wrap">

  <section>
    <h2>설교 말씀</h2>
    <div class="frame" id="sermon">
      <p class="notice">설교 재생목록 주소를 입력하면 최신 설교 영상이 여기에 표시됩니다.</p>
    </div>
    <div class="buttons">
      <a class="btn primary" href="https://www.youtube.com/@한강밤섬교회/live" target="_blank" rel="noopener">실시간 예배 보기</a>
      <a class="btn" href="https://www.youtube.com/@한강밤섬교회/playlists" target="_blank" rel="noopener">지난 설교 전체 보기</a>
    </div>
  </section>

  <section>
    <h2>오시는 길</h2>
    <div class="frame map">
      <iframe
        src="https://maps.google.com/maps?q=서울특별시%20마포구%20창전로%2032&z=17&output=embed"
        title="한강밤섬교회 위치 지도" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>
    <address>
      서울특별시 마포구 창전로 32
      <small>밤섬빌딩 4층</small>
    </address>
    <div class="buttons">
      <a class="btn primary" href="https://map.naver.com/p/search/서울특별시%20마포구%20창전로%2032" target="_blank" rel="noopener">네이버지도로 길찾기</a>
      <a class="btn" href="https://map.kakao.com/link/search/서울특별시%20마포구%20창전로%2032" target="_blank" rel="noopener">카카오맵으로 길찾기</a>
      <button class="btn" type="button" id="copy">주소 복사</button>
    </div>
  </section>

</main>

<footer>
  <div class="wrap">
    <p class="name">대한예수교장로회 한강밤섬교회</p>
    <p>서울특별시 마포구 창전로 32 밤섬빌딩 4층</p>
    <p>문의 <a href="mailto:bamseomchurch@gmail.com">bamseomchurch@gmail.com</a></p>
    <p class="copy">© <span id="year">2026</span> 한강밤섬교회. All rights reserved.</p>
  </div>
</footer>

<script>
  /* ================================================================
     ✏️ 여기만 수정하세요

     SERMON_PLAYLIST: 설교 재생목록 주소를 통째로 붙여넣으세요.
       예) "https://www.youtube.com/playlist?list=PLxxxxxxxxxxxxxxxx"
       해가 바뀌어 새 연도 재생목록을 만들면 이 주소만 바꾸면 됩니다.

     CHANNEL_ID: (선택) 재생목록 주소를 비워두면 채널 전체 영상을 보여줍니다.
     ================================================================ */
  const SERMON_PLAYLIST = "https://www.youtube.com/watch?v=4WTPlw997tU&list=PLTABRuxTL7oCxVd5fbYpjsimLFBi3K1Pz";
  const CHANNEL_ID = "UCl7SMfXFkBmoVAFp-Rv0pwQ";

  (function () {
    let list = "";
    const p = SERMON_PLAYLIST.trim();
    const m = p.match(/list=([\w-]+)/);
    if (m) list = m[1];
    else if (/^[\w-]{12,}$/.test(p)) list = p;
    else if (/^UC[\w-]{22}$/.test(CHANNEL_ID.trim())) list = "UU" + CHANNEL_ID.trim().slice(2);

    if (list) {
      document.getElementById("sermon").innerHTML =
        '<iframe src="https://www.youtube.com/embed/videoseries?list=' + list + '" ' +
        'title="한강밤섬교회 설교 영상" loading="lazy" ' +
        'allow="accelerometer; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';
    }
  })();

  // 저작권 연도 자동 표시
  document.getElementById("year").textContent = new Date().getFullYear();

  // 주소 복사 버튼
  document.getElementById("copy").addEventListener("click", function () {
    const btn = this;
    const text = "서울특별시 마포구 창전로 32 밤섬빌딩 4층";
    navigator.clipboard.writeText(text).then(function () {
      btn.textContent = "주소 복사됨";
      setTimeout(function () { btn.textContent = "주소 복사"; }, 2000);
    }).catch(function () {
      window.prompt("아래 주소를 복사하세요", text);
    });
  });
</script>
</body>
</html>
