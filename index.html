<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>한강밤섬교회</title>
  <meta name="description" content="대한예수교장로회 한강밤섬교회 · 주일예배 오전 11시 · 서울특별시 마포구 창전로 32 밤섬빌딩 4층">
  <!-- 카카오톡·문자로 링크를 보낼 때 보이는 미리보기 -->
  <meta property="og:title" content="우리는 한강밤섬교회입니다">
  <meta property="og:description" content="주일예배 오전 11시 · 마포구 창전로 32 밤섬빌딩 4층">
  <meta property="og:image" content="https://www.bamseom.net/church.jpg">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --logo: #22a4be;      /* CI 색상 */
      --deep: #12697b;      /* 글자·버튼용 짙은 청록 */
      --mist: #edf6f8;
      --ink: #1c2629;
      --soft: #56666b;
      --paper: #ffffff;
      --line: #d3e3e7;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --deep: #7fd0e0;
        --mist: #142024;
        --ink: #e7f0f2;
        --soft: #a4b6ba;
        --paper: #0d1619;
        --line: #26393e;
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      font-size: 17px;
      line-height: 1.7;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .wrap { max-width: 680px; margin: 0 auto; padding: 0 22px; }

    /* 머리 부분: CI + 교회 이름 */
    header {
      background: var(--mist);
      padding: calc(44px + env(safe-area-inset-top, 0px)) 0 40px;
    }
    .id { display: flex; align-items: center; gap: 22px; }
    .id img { width: 104px; height: 104px; flex: none; }
    .denomination { margin: 0; color: var(--soft); font-size: 15px; }
    h1 {
      margin: 2px 0 0;
      font-family: "Gowun Batang", "Nanum Myeongjo", serif;
      font-weight: 700;
      font-size: clamp(34px, 9vw, 52px);
      line-height: 1.15;
      color: var(--deep);
    }
    .worship {
      margin: 28px 0 0;
      padding-left: 14px;
      border-left: 4px solid var(--logo);
      font-size: 19px;
      line-height: 1.5;
    }
    .worship strong { font-weight: 700; }

    /* 예배당 사진 */
    figure { margin: 0; }
    .photo img {
      display: block;
      width: 100%;
      height: auto;
      max-width: 1200px;
      margin: 0 auto;
      aspect-ratio: 2 / 1;
      object-fit: cover;
      object-position: 50% 60%;
    }
    .photo figcaption { max-width: 680px; margin: 10px auto 0; padding: 0 22px; color: var(--soft); font-size: 14px; }
    @media (max-width: 600px) { .photo img { aspect-ratio: 4 / 3; } }

    section { padding: 44px 0 8px; }
    h2 {
      margin: 0 0 16px;
      font-family: "Gowun Batang", "Nanum Myeongjo", serif;
      font-size: 26px;
      font-weight: 700;
    }
    .frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: var(--mist);
      border-radius: 6px;
      overflow: hidden;
    }
    .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .frame.map { aspect-ratio: 4 / 3; }
    .notice { position: absolute; inset: 0; margin: 0; display: grid; place-items: center; padding: 20px; text-align: center; color: var(--soft); font-size: 15px; }

    .buttons { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 48px; padding: 0 20px;
      border-radius: 999px;
      font: inherit; font-size: 16px; font-weight: 500;
      text-decoration: none; cursor: pointer;
      border: 1px solid var(--line);
      background: var(--paper); color: var(--ink);
    }
    .btn.primary { background: var(--deep); border-color: var(--deep); color: var(--paper); }
    .btn:focus-visible { outline: 3px solid var(--logo); outline-offset: 2px; }

    address { font-style: normal; margin-top: 18px; font-size: 18px; }
    address small { display: block; color: var(--soft); font-size: 15px; }

    footer {
      margin-top: 56px;
      padding: 28px 0 40px;
      border-top: 1px solid var(--line);
      color: var(--soft);
      font-size: 14px;
    }
  </style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="id">
      <img src="logo.png" alt="우리는 한강밤섬교회입니다">
      <div>
        <p class="denomination">대한예수교장로회</p>
        <h1>한강밤섬교회</h1>
      </div>
    </div>
    <p class="worship">주일예배 <strong>오전 11시</strong></p>
  </div>
</header>

<figure class="photo">
  <img src="church.jpg" alt="한강밤섬교회 예배당 강단" width="1600" height="798">
  <figcaption>밤섬빌딩 4층 예배당</figcaption>
</figure>

<main class="wrap">

  <section>
    <h2>설교 말씀</h2>
    <div class="frame" id="sermon">
      <p class="notice">유튜브 채널 ID를 입력하면 최신 설교 영상이 여기에 표시됩니다.</p>
    </div>
    <div class="buttons">
      <a class="btn primary" href="https://www.youtube.com/@한강밤섬교회/live" target="_blank" rel="noopener">실시간 예배 보기</a>
      <a class="btn" href="https://www.youtube.com/@한강밤섬교회/videos" target="_blank" rel="noopener">지난 설교 전체 보기</a>
    </div>
  </section>

  <section>
    <h2>오시는 길</h2>
    <div class="frame map">
      <iframe
        src="https://maps.google.com/maps?q=서울특별시%20마포구%20창전로%2032&z=17&output=embed"
        title="한강밤섬교회 위치 지도" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>
    <address>
      서울특별시 마포구 창전로 32
      <small>밤섬빌딩 4층</small>
    </address>
    <div class="buttons">
      <a class="btn primary" href="https://map.naver.com/p/search/서울특별시%20마포구%20창전로%2032" target="_blank" rel="noopener">네이버지도로 길찾기</a>
      <a class="btn" href="https://map.kakao.com/link/search/서울특별시%20마포구%20창전로%2032" target="_blank" rel="noopener">카카오맵으로 길찾기</a>
      <button class="btn" type="button" id="copy">주소 복사</button>
    </div>
  </section>

</main>

<footer>
  <div class="wrap">대한예수교장로회 한강밤섬교회</div>
</footer>

<script>
  /* ================================================================
     ✏️ 여기만 수정하세요: 유튜브 채널 ID (UC로 시작하는 24자리)
     예) const CHANNEL_ID = "UCabcdefghijklmnopqrstuv";
     ================================================================ */
  const CHANNEL_ID = "UCl7SMfXFkBmoVAFp-Rv0pwQ";

  // 채널 ID의 UC를 UU로 바꾸면 '업로드한 영상 전체' 재생목록이 됩니다.
  // 새 영상을 올리면 자동으로 맨 앞에 표시되므로 매주 수정할 필요가 없습니다.
  if (/^UC[\w-]{22}$/.test(CHANNEL_ID.trim())) {
    const list = "UU" + CHANNEL_ID.trim().slice(2);
    document.getElementById("sermon").innerHTML =
      '<iframe src="https://www.youtube.com/embed/videoseries?list=' + list + '" ' +
      'title="한강밤섬교회 설교 영상" loading="lazy" ' +
      'allow="accelerometer; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';
  }

  // 주소 복사 버튼
  document.getElementById("copy").addEventListener("click", function () {
    const btn = this;
    const text = "서울특별시 마포구 창전로 32 밤섬빌딩 4층";
    navigator.clipboard.writeText(text).then(function () {
      btn.textContent = "주소 복사됨";
      setTimeout(function () { btn.textContent = "주소 복사"; }, 2000);
    }).catch(function () {
      window.prompt("아래 주소를 복사하세요", text);
    });
  });
</script>
</body>
</html>
